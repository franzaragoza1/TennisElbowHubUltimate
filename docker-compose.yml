# Uso: docker compose up -d --build
#
# Antes del primer arranque: copia tu carpeta `.playwright/` YA RESUELTA (la que ya
# pasó el challenge anti-bot al menos una vez, con ventana visible) a
# `./.playwright` junto a este fichero — el contenedor la monta tal cual. Sin esto,
# el contenedor no tiene forma de resolver el challenge por primera vez (no hay
# pantalla dentro de él).
#
# Necesita un `.env` junto a este fichero — copia `.env.example`, rellénalo entero
# (no solo lo que use el scraper: los tres servicios de abajo comparten el mismo
# fichero) y presta atención especial a dos cosas que aquí SÍ importan aunque en un
# `.env` de desarrollo normal no:
#   - DATABASE_URL tiene que apuntar a la MISMA base de datos de producción que lee
#     el sitio en Render (nunca una de desarrollo) — si no, esto escribe resultados
#     que la web nunca ve.
#   - SCRAPER_SECRET tiene que ser el MISMO valor puesto en las variables de entorno
#     de producción de Render — un valor distinto aquí y el webhook de
#     `/api/scraper/revalidate` responde 401 en silencio y el sitio nunca revalida.
# No se mantiene aquí una lista aparte de qué variable usa cada servicio — ya se
# desincronizó una vez (2026-09-20: el bot ya necesitaba los roles de Discord y R2
# para entonces, y esta lista seguía sin mencionarlos) — `.env.example` es la única
# fuente de verdad de qué existe y para qué sirve cada una.
#
# El `.env` se MONTA como fichero dentro del contenedor (no `env_file:`) a propósito:
# `npm run autoscrape`/`npm run bot`/`npm run live-scores-sync` invocan `node
# --env-file=.env`, que esperan un fichero real en esa ruta y fallan si no existe —
# `env_file:` de Docker Compose solo mete las variables en el entorno del proceso,
# nunca crea ese fichero dentro del contenedor.
services:
  # Postgres propio (2026-10-17, ver docs/decisiones.md): sustituye a Neon. Sin `ports:`
  # a propósito — solo lo ven los contenedores de este mismo docker-compose (red
  # interna, nombre de host `db`), nunca internet. La contraseña sale de
  # POSTGRES_PASSWORD en el `.env` de al lado (Docker Compose lo lee solo para
  # sustituir variables), y DATABASE_URL de ese `.env` apunta aquí:
  # postgres://xkt:<POSTGRES_PASSWORD>@db:5432/xkt
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: xkt
      POSTGRES_DB: xkt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
    # Postgres 18 guarda los datos en /var/lib/postgresql/<versión>/docker: se monta la
    # carpeta de arriba (así lo pide la propia imagen desde la 18)
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xkt -d xkt"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Copia diaria cifrada de la base de datos (scripts/db-backup.sh): ./backups en este
  # servidor (7 días) y R2, carpeta db-backups/ (14 días). Necesita BACKUP_PASSPHRASE en
  # el `.env` — y una copia de esa clave FUERA del servidor: sin ella, las copias no se
  # pueden abrir.
  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Rome
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups

  # La web (antes en Render). Sirve el build que deja scripts/deploy.sh en el volumen
  # `webnext` (build/current; el siguiente se construye al lado, en build/next). Solo escucha en 127.0.0.1:3000 del propio servidor: el tráfico de internet
  # le llega por el túnel de Cloudflare (servicio `tunnel`), nunca por un puerto abierto.
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      # mismo dominio que SITE_URL; fijo para que Auth.js no deduzca otro del host interno
      AUTH_URL: https://www.xkt-tour.com
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      NEXT_DIST_DIR: build/current
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - webnext:/app/build
    ports:
      - "127.0.0.1:3000:3000"

  # Túnel de Cloudflare: lleva xkt-tour.com hasta `web:3000` sin abrir ningún puerto del
  # servidor a internet (HTTPS lo pone Cloudflare). El token del túnel (Cloudflare Zero
  # Trust -> Networks -> Tunnels) va en CLOUDFLARE_TUNNEL_TOKEN del `.env`.
  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web
    profiles: ["tunnel"]

  scraper:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./.env:/app/.env:ro
      - ./.playwright:/app/.playwright
    # Sin puertos publicados a propósito — este contenedor no sirve nada, solo
    # scrapea y escribe en la base de datos.

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "bot"]
    volumes:
      - ./.env:/app/.env:ro
    # Sin `.playwright/` a propósito — el bot nunca usa Playwright/Chromium, solo
    # discord.js y la base de datos. Misma imagen que `scraper` (ya hace falta
    # construirla igualmente), solo cambia el comando que arranca dentro.

  live-scores-sync:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "live-scores-sync"]
    volumes:
      - ./.env:/app/.env:ro
    # Igual que `bot`: sin `.playwright/`, fetchLiveHtml() usa fetch() normal, sin
    # challenge anti-bot en esa ruta. Movido aquí desde app/api/live-scores/route.ts
    # (que ahora solo lee la fila que este proceso escribe) porque era, con
    # diferencia, la ruta que más CPU activa real gastaba en el hosting de la web
    # (Vercel entonces, Render ahora — el motivo no depende de cuál) — ver el
    # comentario de `live_scores_cache` en db/schema.ts.

volumes:
  pgdata:
  webnext:
