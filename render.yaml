services:
  - type: web
    name: xkt-tour
    runtime: node
    plan: free
    buildCommand: npm ci && node node_modules/drizzle-kit/bin.cjs migrate && npm run build
    startCommand: next start -p $PORT
    envVars:
      - key: NODE_ENV
        value: production
      # Sin esto, `npm ci` se salta devDependencies (drizzle-kit, typescript,
      # tailwindcss...) en cuanto ve NODE_ENV=production durante el build — y el
      # build los necesita de verdad (migrate, el propio `next build`). No afecta al
      # modo en que corre la app ya construida, solo a qué se instala.
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      # `playwright` es devDependency solo para los scripts locales de scraping
      # (scripts/explore.ts, backfill.ts, autoScrape.ts) — nunca corre en el propio
      # servicio web. Sin esto, su postinstall descarga los binarios de Chromium/
      # Firefox/WebKit enteros en cada build de Render, para nada.
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
      # Sin esto, Auth.js intenta deducir su propia URL del host de la petición —
      # y en Render eso resuelve a `localhost:10000` (el puerto interno del
      # contenedor), no al dominio público, así que el `redirect_uri` que le manda a
      # Discord nunca coincide con ninguno de los registrados ("Invalid OAuth2
      # redirect URI" real, 2026-09-15). Fijo aquí en vez de deducido: mismo dominio
      # que ya usa `SITE_URL` en el resto del proyecto.
      - key: AUTH_URL
        value: https://www.xkt-tour.com
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_DISCORD_ID
        sync: false
      - key: AUTH_DISCORD_SECRET
        sync: false
      - key: ADMIN_DISCORD_USER_IDS
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: SCRAPER_SECRET
        sync: false
      - key: SITE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: DISCORD_AWARDS_CHANNEL_ID
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Igual que VAPID_PUBLIC_KEY pero expuesta al navegador — Next.js la inyecta en
      # el bundle durante `next build` (parte del buildCommand de este servicio), así
      # que tiene que existir como variable de entorno normal de Render, no solo en el
      # runtime del proceso ya arrancado.
      - key: NEXT_PUBLIC_VAPID_PUBLIC_KEY
        sync: false
